[project]
name = "legistar-scraper"
version = "0.1.0"
description = "Ingest Hennepin County legislative records from the Legistar Web API for a RAG question answering system"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "pyarrow>=26.0.1",
    "striprtf>=0.0.35",
]

[project.scripts]
legistar = "legistar_scraper.cli:main"

[project.optional-dependencies]
spark = [
    "graphframes-py>=0.12.3",
    "numpy>=2.5.4",
    "pyspark>=4.1,<4.2",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
